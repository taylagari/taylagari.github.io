<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In | Taylagari</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link rel="stylesheet" href="/public/styles/brand.css" />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: "#1e40af",
              secondary: "#3b82f6",
              accent: "#f97316",
            },
          },
        },
      };
    </script>
  </head>
  <body class="bg-gray-50">
    <header class="bg-white shadow-md fixed w-full z-50 rounded-b-lg">
      <div
        class="container mx-auto px-4 py-3 flex justify-between items-center"
      >
        <div class="flex items-center">
          <a href="/" class="flex items-center">
            <img
              src="./public/images/logo/icon.png"
              alt="Taylagari Logo"
              class="h-20 w-20 mr-2"
            />
            <h1 class="text-4xl font-bold text-gray-700 uppercase">
              <span class="text-black">Taylagari</span>
            </h1>
          </a>
        </div>
        <nav class="hidden lg:flex space-x-8 items-center">
          <a
            href="/flight.html"
            class="nav-item text-lg text-gray-700 font-medium py-2"
            >Flight</a
          >
          <a
            href="/hotel.html"
            class="nav-item text-lg text-gray-700 font-medium py-2"
            >Hotel</a
          >
          <a
            href="/tour.html"
            class="nav-item text-lg text-gray-700 font-medium py-2"
            >Tour</a
          >
          <a
            href="/visa.html"
            class="nav-item text-lg text-gray-700 font-medium py-2"
            >Visa</a
          >
          <a
            href="/media.html"
            class="nav-item text-lg text-gray-700 font-medium py-2"
            >Media</a
          >
          <a
            href="/auth.html"
            class="bg-gray-700 hover:bg-blue-600 text-lg px-4 py-2 rounded-lg font-semibold text-white"
            >Sign In</a
          >
        </nav>
        <div class="lg:hidden">
          <button id="menu-toggle" class="text-gray-700">
            <i class="fas fa-bars text-xl"></i>
          </button>
        </div>
      </div>
      <div
        id="mobile-menu"
        class="hidden lg:hidden bg-white px-4 py-3 shadow-lg"
      >
        <a
          href="/flight.html"
          class="block px-4 py-3 text-gray-700 border-b hover:bg-blue-200"
          >Flight</a
        >
        <a
          href="/hotel.html"
          class="block px-4 py-3 text-gray-700 border-b hover:bg-blue-200"
          >Hotel</a
        >
        <a
          href="/tour.html"
          class="block px-4 py-3 text-gray-700 border-b hover:bg-blue-200"
          >Tour</a
        >
        <a
          href="/visa.html"
          class="block px-4 py-3 text-gray-700 border-b hover:bg-blue-200"
          >Visa</a
        >
        <a
          href="/media.html"
          class="block px-4 py-3 text-gray-700 border-b hover:bg-blue-200"
          >Media</a
        >
        <a
          href="/auth.html"
          class="block px-4 py-3 text-gray-700 border-b hover:bg-blue-300"
          >Sign In</a
        >
      </div>
    </header>

    <section
      class="bg-gradient-to-r from-blue-600 to-indigo-800 text-white pt-32 pb-16"
    >
      <div class="container mx-auto px-4 text-center">
        <h2 class="text-3xl md:text-5xl font-bold mb-2 heading">
          Welcome Back
        </h2>
        <p class="text-white/90">Access your bookings and saved trips</p>
      </div>
    </section>

    <main class="container mx-auto px-4 py-12">
      <div class="max-w-md mx-auto bg-white rounded-2xl p-6 shadow">
        <div class="flex gap-2 mb-4" role="tablist" aria-label="Auth tabs">
          <button
            id="tab-login"
            data-auth-tab="login"
            class="px-3 py-2 text-sm font-medium rounded-lg bg-blue-100 text-blue-700 hover:bg-blue-200 transition"
            aria-selected="true"
          >
            Login
          </button>
          <button
            id="tab-signup"
            data-auth-tab="signup"
            class="px-3 py-2 text-sm font-medium rounded-lg text-gray-600 hover:bg-gray-100 transition"
            aria-selected="false"
          >
            Sign Up
          </button>
        </div>

        <form id="form-login" class="space-y-3" aria-labelledby="tab-login">
          <div>
            <label class="block text-sm text-gray-700 mb-1">Email</label>
            <input
              type="email"
              class="w-full border rounded-lg px-3 py-2"
              placeholder="you@example.com"
            />
          </div>
          <div>
            <label class="block text-sm text-gray-700 mb-1">Password</label>
            <input
              type="password"
              class="w-full border rounded-lg px-3 py-2"
              placeholder="••••••••"
            />
          </div>
          <button class="btn btn-primary w-full">Sign In</button>
        </form>

        <form
          id="form-signup"
          class="space-y-3 hidden"
          aria-labelledby="tab-signup"
        >
          <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
            <div>
              <label class="block text-sm text-gray-700 mb-1">First Name</label>
              <input
                type="text"
                class="w-full border rounded-lg px-3 py-2"
                placeholder="First name"
              />
            </div>
            <div>
              <label class="block text-sm text-gray-700 mb-1">Last Name</label>
              <input
                type="text"
                class="w-full border rounded-lg px-3 py-2"
                placeholder="Last name"
              />
            </div>
          </div>
          <div>
            <label class="block text-sm text-gray-700 mb-1">Email</label>
            <input
              type="email"
              class="w-full border rounded-lg px-3 py-2"
              placeholder="you@example.com"
            />
          </div>
          <div>
            <label class="block text-sm text-gray-700 mb-1">Password</label>
            <input
              type="password"
              class="w-full border rounded-lg px-3 py-2"
              placeholder="Create a password"
            />
          </div>
          <button class="btn btn-primary w-full">Create Account</button>
        </form>
      </div>
    </main>

    <script type="module">
      import { initCommon } from "/public/scripts/site.js";
      initCommon();
      const tabs = document.querySelectorAll("[data-auth-tab]");
      const loginTab = document.getElementById("tab-login");
      const signupTab = document.getElementById("tab-signup");
      const loginForm = document.getElementById("form-login");
      const signupForm = document.getElementById("form-signup");
      function activate(tab) {
        const isLogin = tab.dataset.authTab === "login";
        loginTab.classList.toggle("bg-blue-100", isLogin);
        loginTab.classList.toggle("text-blue-700", isLogin);
        loginTab.setAttribute("aria-selected", isLogin ? "true" : "false");
        signupTab.classList.toggle("bg-blue-100", !isLogin);
        signupTab.classList.toggle("text-blue-700", !isLogin);
        signupTab.setAttribute("aria-selected", !isLogin ? "true" : "false");
        loginForm.classList.toggle("hidden", !isLogin);
        signupForm.classList.toggle("hidden", isLogin);
      }
      tabs.forEach((t) => t.addEventListener("click", () => activate(t)));
    </script>

    <script>
      document
        .getElementById("menu-toggle")
        .addEventListener("click", function () {
          document.getElementById("mobile-menu").classList.toggle("hidden");
        });
    </script>
  </body>
</html>
