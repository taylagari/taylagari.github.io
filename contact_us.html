<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us | Taylagari</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/public/styles/brand.css" />
  </head>
  <body class="bg-gray-50">
    <header class="bg-white shadow-md fixed w-full z-50 rounded-b-lg">
      <div
        class="container mx-auto px-4 py-3 flex justify-between items-center"
      >
        <a href="/" class="flex items-center"
          ><img
            src="./public/images/logo/icon.png"
            class="h-16 w-16 mr-2"
            alt="Taylagari"
          />
          <h1 class="text-3xl font-bold text-gray-700 uppercase">
            <span class="text-black">Taylagari</span>
          </h1></a
        >
        <nav class="hidden lg:flex space-x-8 items-center">
          <a
            href="/flight.html"
            class="nav-item text-lg text-gray-700 font-medium py-2"
            >Flight</a
          >
          <a
            href="/hotel.html"
            class="nav-item text-lg text-gray-700 font-medium py-2"
            >Hotel</a
          >
          <a
            href="/tour.html"
            class="nav-item text-lg text-gray-700 font-medium py-2"
            >Tour</a
          >
          <a
            href="/visa.html"
            class="nav-item text-lg text-gray-700 font-medium py-2"
            >Visa</a
          >
          <a
            href="/media.html"
            class="nav-item text-lg text-gray-700 font-medium py-2"
            >Media</a
          >
          <a
            href="/auth.html"
            class="bg-gray-700 hover:bg-blue-600 text-lg px-4 py-2 rounded-lg font-semibold text-white"
            >Sign In</a
          >
        </nav>
        <div class="lg:hidden">
          <button id="menu-toggle" class="text-gray-700">
            <i class="fas fa-bars text-xl"></i>
          </button>
        </div>
      </div>
      <div
        id="mobile-menu"
        class="hidden lg:hidden bg-white px-4 py-3 shadow-lg"
      >
        <a
          href="/flight.html"
          class="block px-4 py-3 text-gray-700 border-b hover:bg-blue-200"
          >Flight</a
        >
        <a
          href="/hotel.html"
          class="block px-4 py-3 text-gray-700 border-b hover:bg-blue-200"
          >Hotel</a
        >
        <a
          href="/tour.html"
          class="block px-4 py-3 text-gray-700 border-b hover:bg-blue-200"
          >Tour</a
        >
        <a
          href="/visa.html"
          class="block px-4 py-3 text-gray-700 border-b hover:bg-blue-200"
          >Visa</a
        >
        <a
          href="/media.html"
          class="block px-4 py-3 text-gray-700 border-b hover:bg-blue-200"
          >Media</a
        >
        <a
          href="/auth.html"
          class="block px-4 py-3 text-gray-700 border-b hover:bg-blue-300"
          >Sign In</a
        >
      </div>
    </header>

    <section
      class="bg-gradient-to-br from-blue-600 to-indigo-800 text-white pt-32 pb-16"
    >
      <div class="container mx-auto px-4 text-center">
        <h2 class="text-3xl md:text-5xl font-bold mb-4">Contact Us</h2>
        <p class="text-white/90 max-w-2xl mx-auto">
          We’d love to hear from you. Send us a message.
        </p>
      </div>
    </section>

    <main class="container mx-auto px-4 py-12">
      <div class="max-w-3xl mx-auto bg-white p-6 rounded-2xl shadow">
        <form class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm text-gray-700 mb-1">Name</label>
            <input
              class="w-full border rounded-lg px-3 py-2"
              placeholder="Your name"
            />
          </div>
          <div>
            <label class="block text-sm text-gray-700 mb-1">Email</label>
            <input
              type="email"
              class="w-full border rounded-lg px-3 py-2"
              placeholder="you@example.com"
            />
          </div>
          <div class="md:col-span-2">
            <label class="block text-sm text-gray-700 mb-1">Message</label>
            <textarea
              class="w-full border rounded-lg px-3 py-2"
              rows="5"
              placeholder="How can we help?"
            ></textarea>
          </div>
          <div class="md:col-span-2">
            <button class="btn btn-primary w-full">Send Message</button>
          </div>
        </form>
      </div>
    </main>

    <footer class="bg-gray-800 text-white pt-12 pb-6">
      <div class="container mx-auto px-4">
        <div
          class="border-t border-gray-700 pt-8 text-center text-gray-400 text-sm"
        >
          © 2025 Taylagari. All rights reserved.
        </div>
      </div>
    </footer>
    <script type="module" src="/public/scripts/site.js"></script>
  </body>
</html>
